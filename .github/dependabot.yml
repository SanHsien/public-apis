version: 2
updates:
  # 根目錄 requirements-dev.txt 引用 scripts/requirements.txt；
  # 兩份 manifest 都由本 fork 維護，必須一起通過 resolver 與 CI。
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Asia/Taipei"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Asia/Taipei"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      # init and analyze must run the exact same version -- a split bump fails
      # with "Loaded a configuration file for version X, but running version Y",
      # leaving both pull requests red. Group them so they move together.
      codeql-action:
        patterns:
          - "github/codeql-action*"
