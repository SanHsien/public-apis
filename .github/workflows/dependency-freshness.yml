name: Dependency freshness

# Dependabot answers "is there a newer release of this package?" one pull
# request at a time. Once a month this asks the other question: how far behind
# is what the repo declares? Read-only -- it installs nothing and edits nothing.

on:
  push:
    branches: [main]
    paths:
      - requirements-dev.txt
      - scripts/requirements.txt
      - tools/check_dependency_freshness.py
      - .github/dependabot.yml
      - .github/workflows/dependency-freshness.yml
  pull_request:
    branches: [main]
    paths:
      - requirements-dev.txt
      - scripts/requirements.txt
      - tools/check_dependency_freshness.py
      - .github/dependabot.yml
      - .github/workflows/dependency-freshness.yml
  schedule:
    # Monthly on day 1 at 11:00 Asia/Taipei.
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dependency-freshness
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Check declared dependency ranges
        id: deps
        run: >-
          python tools/check_dependency_freshness.py
          --github-output
          --output dependency-freshness-report.md

      - name: Include open Dependabot pull requests
        id: tracker
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKER_NEEDS_ATTENTION: ${{ steps.deps.outputs.needs_attention }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          open_prs="$(gh pr list --repo SanHsien/public-apis \
            --state open \
            --author app/dependabot \
            --json number,title,url)"
          open_pr_count="$(jq 'length' <<< "$open_prs")"
          needs_attention="$CHECKER_NEEDS_ATTENTION"
          {
            echo
            echo "## Open Dependabot pull requests"
            echo
            if [ "$open_pr_count" -eq 0 ]; then
              echo "- None"
            else
              jq -r '.[] | "- [#\(.number) \(.title)](\(.url))"' <<< "$open_prs"
              # PRs gate their candidate manifests; other events also gate
              # the repository's outstanding dependency maintenance.
              if [ "$EVENT_NAME" != "pull_request" ]; then
                needs_attention="true"
              fi
            fi
          } >> dependency-freshness-report.md
          echo "needs_attention=$needs_attention" >> "$GITHUB_OUTPUT"
          cat dependency-freshness-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Mark maintenance as required
        if: steps.tracker.outputs.needs_attention == 'true'
        run: |
          echo "::error::Dependency maintenance is required. See the workflow summary and Dependabot pull requests."
          exit 1
